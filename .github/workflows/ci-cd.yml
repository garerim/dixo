name: CI/CD

# GitHub Actions pilote tout le pipeline :
#   1. Lint + tests (Vitest)         -> job `test`
#   2. Déploiement Vercel via la CLI -> jobs `deploy-*` (uniquement si `test` passe)
#
# Le déploiement automatique de Vercel (Git integration) est désactivé via
# `git.deploymentEnabled: false` dans vercel.json : GitHub Actions est la seule
# source de déploiement, ce qui garantit qu'aucun code ne part en prod sans
# avoir passé les tests.

on:
  push:
    branches: [main]
  pull_request:

# Annule un run en cours si un nouveau push arrive sur la même branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Qualité : lint + tests unitaires. Bloque tout le reste s'il échoue.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-bloquant : remonte les problèmes de style sans faire échouer le
      # pipeline (le code a des erreurs ESLint pré-existantes). Seuls les tests
      # ci-dessous bloquent le déploiement.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests (Vitest)
        run: npm test

  # ---------------------------------------------------------------------------
  # 2a. Déploiement PREVIEW — sur chaque Pull Request.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview déployée : $url"

  # ---------------------------------------------------------------------------
  # 2b. Déploiement PRODUCTION — sur push vers main.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel, production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact (production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production déployée : $url"
