name: CI/CD

# GitHub Actions pilote tout le pipeline :
#   1. Lint + tests unitaires (Vitest)   -> job `test`
#   2. Tests end-to-end (Playwright)      -> job `e2e`
#   3. Déploiement Vercel via la CLI      -> jobs `deploy-*`
#
# Les déploiements ne se lancent QUE si `test` ET `e2e` passent (quality gate).
# Le déploiement automatique de Vercel (Git integration) est désactivé via
# `git.deploymentEnabled: false` dans vercel.json : GitHub Actions est la seule
# source de déploiement.

on:
  push:
    branches: [main]
  pull_request:

# Annule un run en cours si un nouveau push arrive sur la même branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Qualité : lint + tests unitaires. Bloque tout le reste s'il échoue.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-bloquant : remonte les problèmes de style sans faire échouer le
      # pipeline (le code a des erreurs ESLint pré-existantes). Seuls les tests
      # ci-dessous bloquent le déploiement.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Lance les tests unitaires AVEC couverture de code.
      # Échoue si la couverture passe sous les seuils définis dans vitest.config.
      - name: Tests + couverture (Vitest)
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Tests E2E : build l'app, la démarre et la teste dans un vrai navigateur.
  #    Les variables d'env (Supabase…) viennent de `vercel pull` -> aucun
  #    secret supplémentaire à configurer.
  # ---------------------------------------------------------------------------
  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # `next build` / `next start` chargent automatiquement `.env.local`.
      - name: Prepare environment variables
        run: cp .vercel/.env.preview.local .env.local

      - name: Build app
        run: npm run build

      # Playwright démarre `npm run start` (config: webServer en mode CI).
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3a. Déploiement PREVIEW — sur chaque Pull Request.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview déployée : $url"

  # ---------------------------------------------------------------------------
  # 3b. Déploiement PRODUCTION — sur push vers main.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel, production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact (production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production déployée : $url"
